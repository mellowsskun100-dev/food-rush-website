<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Food Rush - Play</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <nav>
    <span class="logo">🍕 Food Rush</span>
    <div class="links">
      <a href="index.html">Home</a>
      <a href="play.html" class="active">Play</a>
      <a href="about.html">About</a>
    </div>
  </nav>

  <main class="game-area">
    <h1>Play Food Rush</h1>

    <!-- Score, lives, and best score -->
    <div class="hud">
      <span>Score: <b id="score">0</b></span>
      <span id="lives">❤️❤️❤️</span>
      <span>Best: <b id="best">0</b></span>
    </div>

    <canvas id="game" width="400" height="500"></canvas>

    <button id="startBtn">Play</button>
    <p class="hint">Laptop: Arrow keys or A / D. Phone: drag your finger.</p>
  </main>

  <footer>
    <p>Made by [Your Name] | [Your Course and School] | 2026</p>
  </footer>

  <script src="game.js"></script>
</body>
</html>
